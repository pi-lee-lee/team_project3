# 화재 점검 로봇 서비스 — 전체 구동
#   cp .env.example .env   (비밀번호·키 수정)
#   docker compose up -d --build
#   http://localhost:8080
#
# 폴더 구조 = 아키텍처 계층(web: 서버 쪽 / ros: 로봇 쪽) > 컨테이너(서비스)마다 폴더 하나
#   web/<서비스>/   src + 빌드 파일 + Dockerfile — 서비스 하나가 독립적으로 빌드·구동된다
#   web/common/     서비스 간 계약(JWT·사용자 헤더) 공유 라이브러리 — common-build 가 m2 볼륨에 설치
#   ros/sim/        시뮬레이션(Gazebo·Nav2·SLAM) / ros/robot/ 로봇 측 노드(실제 로봇에도 같은 코드) / ros/maps/ 지도
# 이미지에는 실행 환경만 있고, 코드는 각 폴더를 볼륨으로 연결해 구동한다. 코드를 고친 뒤:
#   Spring 서비스 : docker compose restart <서비스>          (시작할 때 다시 빌드한다)
#   common 변경   : docker compose run --rm common-build && docker compose restart gateway user-service inspection-service robot-service
#   화면          : docker compose run --rm frontend-build   (nginx 는 그대로)
#   분석·ROS      : docker compose restart analysis-service | sim
#
# 네트워크
#   edge    : web(nginx) ↔ gateway            — 외부에 여는 포트는 web 의 8080 하나
#   backend : gateway ↔ 서비스들 ↔ db
#   robot   : robot-service ↔ sim(rosbridge)  — rosbridge 는 robot-service 만 접근
name: tp3

x-spring: &spring
  restart: unless-stopped
  mem_limit: 1g                 # 시작할 때 Maven 빌드까지 하므로 여유를 둔다
  networks: [backend]
  environment: &spring-env
    JWT_SECRET: ${JWT_SECRET}
    DB_PASSWORD: ${SERVICE_DB_PASSWORD}
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:$${SERVER_PORT}/actuator/health"]
    interval: 10s
    timeout: 3s
    start_period: 180s
    retries: 10

x-after-common: &after-common
  common-build: { condition: service_completed_successfully }
  db: { condition: service_healthy }

services:
  # ================================================================ web (서버 쪽)
  common-build:                 # 공유 라이브러리를 로컬 Maven 저장소(m2 볼륨)에 설치하고 끝난다
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    command: ["mvn", "-q", "-B", "install", "-DskipTests"]
    volumes:
      - ./web/common:/workspace
      - m2:/root/.m2
    restart: "no"

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./web/db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  user-service:
    <<: *spring
    build: ./web/user-service
    volumes:
      - ./web/user-service:/workspace
      - m2:/root/.m2
    environment:
      <<: *spring-env
      SERVER_PORT: 8081
      INITIAL_ADMIN_LOGIN: ${INITIAL_ADMIN_LOGIN:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      DEMO_USERS_PASSWORD: ${DEMO_USERS_PASSWORD:-}
    depends_on: *after-common

  inspection-service:
    <<: *spring
    build: ./web/inspection-service
    volumes:
      - ./web/inspection-service:/workspace
      - m2:/root/.m2
      - photos:/data/photos
    environment:
      <<: *spring-env
      SERVER_PORT: 8082
    depends_on: *after-common

  robot-service:
    <<: *spring
    build: ./web/robot-service
    volumes:
      - ./web/robot-service:/workspace
      - m2:/root/.m2
    environment:
      <<: *spring-env
      SERVER_PORT: 8083
      SIM_ROSBRIDGE_URL: ws://sim:9090
      SIM_VIDEO_URL: http://sim:8080
    networks: [backend, robot]
    depends_on: *after-common

  gateway:
    <<: *spring
    build: ./web/gateway
    volumes:
      - ./web/gateway:/workspace
      - m2:/root/.m2
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8080
    networks: [edge, backend]
    depends_on:
      common-build: { condition: service_completed_successfully }

  analysis-service:
    build: ./web/analysis-service
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DB_URL: postgresql://analysis_svc@db:5432/analysisdb
      DB_PASSWORD: ${SERVICE_DB_PASSWORD}
    volumes:
      - ./web/analysis-service/src:/app:ro
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/health')"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 10

  frontend-build:               # React 화면을 web/frontend/dist 로 빌드하고 끝난다
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run build"]
    volumes:
      - ./web/frontend:/app
      - frontend_modules:/app/node_modules
    restart: "no"

  web:                          # 정문: 화면 파일 제공 + /api·/ws 를 gateway 로 전달
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/frontend/dist:/usr/share/nginx/html:ro
    networks: [edge]
    depends_on:
      frontend-build: { condition: service_completed_successfully }
      gateway: { condition: service_started }

  # ================================================================ ros (로봇 쪽)
  # TurtleBot3 시뮬레이션. Gazebo Classic 이 amd64 전용이라 Apple Silicon 에서는 에뮬레이션으로 실행된다.
  # SIM_MODE=nav (기본): 저장 지도(ros/maps/site.yaml, 없으면 reference.yaml) + AMCL + Nav2
  # SIM_MODE=slam      : slam_toolbox 로 지도 작성 → /sim/tools/explore.sh → /sim/tools/save_map.sh
  # 실제 로봇으로 바꿀 때는 이 서비스를 빼고 실행한다: docker compose up -d --scale sim=0
  sim:
    build: ./ros/sim
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 3500m
    environment:
      SIM_MODE: ${SIM_MODE:-nav}
    volumes:
      - ./ros/sim/src:/sim:ro
      - ./ros/robot/src:/robot:ro
      - ./ros/maps:/maps
    networks: [robot]

networks:
  edge:
  backend:
  robot:

volumes:
  pgdata:
  photos:
  m2:
  frontend_modules:
