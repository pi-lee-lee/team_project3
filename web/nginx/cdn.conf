# CDN 엣지(edge) 역할: 브라우저가 처음 만나는 서버. 원본(web)의 화면 파일을 받아 보관해 두고 대신 내준다.
# 실제 서비스에서는 이 자리에 CloudFront·Cloudflare 같은 외부 CDN 이 오고, 세계 여러 지역에 같은 엣지가 놓인다.
# 여기서는 그 엣지 한 대를 nginx 캐시 프록시로 흉내 낸다. 동작 원리(캐시 키, 유효 기간, 재검증, 우회 경로)는 같다.
#
# 확인: 응답 헤더 X-Cache-Status 가 MISS(원본에서 받아 옴) → HIT(보관본을 내줌) 으로 바뀐다.
#   curl -sI http://localhost:8080/assets/<파일> | grep -i x-cache
# 비우기(purge): docker compose up -d --force-recreate cdn   (보관본은 컨테이너 안에만 있다)

# 보관소: 키 목록 10MB(약 8만 건), 본문 최대 200MB, 7일간 아무도 찾지 않으면 지운다.
proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn:10m max_size=200m inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    # 원본 주소를 요청 때마다 도커 DNS 로 찾는다. 이렇게 하지 않으면 web 을 재생성해 IP 가 바뀌었을 때 옛 IP 로 보낸다.
    resolver 127.0.0.11 valid=10s;
    set $origin http://web:80;

    proxy_http_version 1.1;                 # 1.0 이면 원본이 gzip 압축을 해 주지 않는다
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # ---- 캐시하는 경로: 화면 파일 ----
    # 유효 기간은 원본의 Cache-Control 을 따른다.
    #   /assets/*   max-age=1년  → 한 번 받아 오면 계속 HIT
    #   index.html  no-cache     → 보관하지 않고 매번 원본에서 받는다(새 빌드가 바로 보인다)
    location / {
        proxy_pass $origin;
        proxy_cache cdn;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_valid 200 10m;          # 원본이 Cache-Control 을 주지 않은 파일(favicon 등)의 기본값
        proxy_cache_lock on;                # 같은 파일을 여럿이 동시에 처음 찾아도 원본에는 한 번만 간다
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;   # 원본이 죽어도 보관본으로 버틴다
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ---- 캐시하지 않는 경로: 사용자마다·순간마다 다른 응답 ----
    # 로그인 쿠키가 실린 API 응답을 보관하면 남의 데이터를 내주게 된다. 그대로 통과시킨다.
    # 버퍼링을 꺼서 MJPEG 영상 프레임이 밀리지 않게 한다.
    location /api/ {
        proxy_pass $origin;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # 원격 조종 WebSocket
    location /ws/ {
        proxy_pass $origin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
