# 원본 서버(origin): React 화면 파일을 내주고, /api 와 /ws 는 게이트웨이로 넘긴다.
# 앞단의 cdn 컨테이너(web/nginx/cdn.conf)가 이 서버의 응답을 받아 캐시한다.
# 무엇을 얼마나 캐시할지는 원본이 Cache-Control 헤더로 정하고, cdn 과 브라우저는 그 지시를 따른다.
server {
    listen 80;
    server_name _;
    client_max_body_size 12m;

    root /usr/share/nginx/html;

    # 텍스트 계열 파일은 압축해서 보낸다. Vary: Accept-Encoding 을 붙여 cdn 이 압축본·비압축본을 따로 보관하게 한다.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # index.html: 매번 원본에 확인한다(no-cache = 저장은 하되 쓰기 전에 재검증).
    # 새로 빌드하면 index.html 이 가리키는 /assets 파일 이름이 바뀌므로, 이 파일만 최신이면 화면 전체가 최신이 된다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # /assets/*: Vite 가 내용 해시를 파일 이름에 넣는다(index-3fa9c1.js). 내용이 바뀌면 이름이 바뀌므로 1년간 그대로 써도 된다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;   # /app/tasks/12 같은 화면 주소도 index.html 로
    }

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MJPEG 영상: 버퍼링을 끄지 않으면 프레임이 밀린다
    location ~ ^/api/robots/[0-9]+/stream$ {
        proxy_pass http://gateway:8080;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # 원격 조종 WebSocket
    location /ws/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
