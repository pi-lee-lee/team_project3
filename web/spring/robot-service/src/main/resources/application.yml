server:
  port: 8083
  error:
    include-message: always
spring:
  application:
    name: robot-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/robotdb}
    username: ${DB_USER:robot_svc}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  mvc:
    async:
      request-timeout: -1   # MJPEG 영상 중계는 연결이 끝날 때까지 유지
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  inspection-url: ${INSPECTION_SERVICE_URL:http://inspection-service:8082}
  # 시뮬레이션 로봇의 rosbridge 주소. 초기 데이터 등록에만 쓰고, 이후에는 관리자 화면에서 바꾼다.
  sim-rosbridge-url: ${SIM_ROSBRIDGE_URL:ws://sim:9090}
  sim-video-url: ${SIM_VIDEO_URL:http://sim:8080}
