server:
  port: 8082
  error:
    include-message: always
spring:
  application:
    name: inspection-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/inspectiondb}
    username: ${DB_USER:inspection_svc}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
  task:
    scheduling:
      pool:
        size: 4        # 사건 흐름(2초) · 순찰 감시(1.5초) · 예약 점검이 서로 기다리지 않게
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  photo-dir: ${PHOTO_DIR:/data/photos}
  robot-url: ${ROBOT_SERVICE_URL:http://robot-service:8083}
  analysis-url: ${ANALYSIS_SERVICE_URL:http://analysis-service:8084}
  schedule-zone: ${SCHEDULE_ZONE:Asia/Seoul}   # 예약 점검 시각 해석 기준
