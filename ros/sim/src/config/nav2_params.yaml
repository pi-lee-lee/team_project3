# Nav2 설정 — TurtleBot3 Waffle Pi 기본값(turtlebot3_navigation2/param/humble/waffle_pi.yaml)에서 바꾼 점:
#  1) 전역·지역 비용 지도에서 voxel_layer 를 뺐다. 2D 라이다만 쓰는데 voxel 층이 지워지지 않는 표시를 남겨
#     저장 지도 운영(AMCL) 중 실제로 없는 벽(유령 장애물)이 좁은 복도·문을 막는 문제가 있었다.
#  2) 팽창 반경 1.0/0.55 → 지역 0.6 · 전역(계획용) 0.45, 비용 기울기 3. 통행 가능 여부는 로봇 반경 0.22 로만 정해지므로 1.0m 문도 지난다.
#     전역을 0.45 로 좁힌 이유는 6) 참고: 벽에서 0.45m 밖은 비용이 0 이라 열린 곳의 경로가 직선이 된다.
#  3) 도착 허용 오차 0.25 → 위치 0.12m·방향 0.15rad: 촬영 위치·방향을 맞추기 위해.
#  4) AMCL(위치 추정): 긴 복도(C1)에서 복도 방향으로 추정이 미끄러져(0.8m) 라이다가 엉뚱한 곳에 벽을 찍고 문을 막는 문제가 있었다.
#     빔 수 60→180, 갱신 간격 0.25m/0.2rad→0.1m/0.1rad, 라이다 최대 거리 8m(실물 라이다), z_hit 0.5→0.9·z_rand 0.5→0.1,
#     odom 오차 계수 alpha1~4 0.2→0.05 (시뮬레이션 odom 이 정확하기 때문. 실제 로봇은 바퀴 미끄러짐을 보고 0.1~0.2 로 다시 맞춘다).
#  5) 주행 제어기 DWB → Regulated Pure Pursuit → MPPI. 기준은 "감속 없이 최대 속도로 달리는 시간의 비율"(drive_probe.py 의
#     최대속도 유지)이다. RPP 는 벽 비용·굽은 곳·도착 전에 스스로 줄여 열린 직선 60~77%, 굽은 길 50%, 폭 0.6m 틈 37%,
#     달리는 중 갑자기 놓인 장애물 28% 였고, 새 장애물은 다시 계획될 때까지 피하지 못했다. MPPI 는 A* 경로를 따르면서
#     지역 비용 지도의 새 장애물을 바로 비켜 간다 → 같은 시험에서 84~94%. 막혀서 길이 없으면 지금처럼 다시 계획한다.
#     기본 가중치로는 오히려 나빴다(굽은 길 35%, 0.6m 틈 앞에서 70초 멈칫). 바꾼 값과 이유:
#       - PathFollowCritic 5 → 10, vx_std 0.1 → 0.15: 전진(속도)을 우선한다.
#       - ObstaclesCritic repulsion_weight 1.5 → 0.5: 벽에서 미는 점수가 크면 틈에 들어가는 것보다 서 있는 쪽이 점수가 좋았다.
#       - PathAlignCritic 14 유지: 10 으로 낮추면 굽은 곳 안쪽을 깎아 벽에 붙고 복구 동작이 났다.
#       - GoalAngleCritic 이 켜지는 거리 0.4 → 0.15m: 0.4 면 진행 방향과 도착 방향이 다른 지점(P1)에서 옆으로 0.2m 남기고
#         돌아서 버려 도착하지 못했다(후진은 막아 두었다).
#     해 보고 버린 것:
#       - 지역 비용 지도만 실제 외곽 사각형(+여유 0.03)으로: 폭 0.55m 틈은 85% 로 지났지만, 계획(원 0.22)이 '충돌'로 보는
#         자리까지 제어기가 들어가 0.9m 문에서 벽에 끼고 'Starting point in lethal space' 로 계획이 막혔다. 계획과 제어는 같은 모양을 쓴다.
#       - wz_std 0.5 → 0.3(후보를 경로 가까이 모으기): 좁은 틈은 나아지지 않고 굽은 길에서 멈칫했다(89% → 52%).
#     한계: 폭 0.7m 틈까지는 속도를 유지하고 지난다. 0.6m 는 중심이 지날 띠가 0.16m 뿐이라 후보 궤적 대부분이 충돌로 버려져
#     틈 앞에서 멈칫하거나 실패한다(RPP 는 느리게나마 0.55m 까지 지났다). 이 시설에서 가장 좁은 곳은 0.9m 문이다.
#  6) 계획: "처음에 출렁임 없는 최단 경로를 한 번 세우고, 그 경로를 제어기가 따라간다."
#     - 계획기 NavFn → Smac 2D A* + smoother → Theta*(any-angle A*). Smac 은 넓게 퍼진 벽 비용을 따라 통로 가운데로 휘어
#       열린 곳에서도 S 자로 출렁였다. Theta* 는 서로 보이는 점끼리 직선으로 이어 곧은 구간 + 모퉁이로만 된 경로를 낸다.
#     - 벽 여유는 전역 팽창 0.45m 띠 + w_traversal_cost 2.0 으로 둔다. 띠 없이 최단(w_traversal 0.2)으로 내면 모퉁이를
#       0.22m 로 스쳐, 따라가던 로봇이 충돌 구역에 들어 'start or goal pose are an obstacle' 로 계획이 거부됐다(3구간 실패).
#     - 행동 트리 navigate_fixed_plan.xml: 기본 트리는 1초마다 다시 계획해 주행 중 경로가 흔들렸다. 이제 처음 계획을 유지하고
#       목표가 바뀌었거나 경로가 막혔을 때(IsPathValid), 제어기 실패·복구 동작 뒤에만 다시 계획한다.
#     측정은 tools/plan_probe.py(로봇을 움직이지 않고 경로의 길이·꺾임·벽 여유를 잰다).
#  7) 지나지 못하는 자리 피하기: 계획기(반지름 0.22 원)는 폭 0.6m 틈을 '지날 수 있다'고 보는데 제어기는 그 앞에서
#     20~30초 멈칫했다(0.5m 틈은 계획이 막힌 것으로 보고 바로 돌아가 오히려 12~18초 빨랐다). 계획용 반지름을 키우는
#     방법은 쓸 수 없다: 0.28 부터 전기실 문(설계 0.9m, 비용 지도에서는 0.6m 틈과 비슷)이 막힌 것으로 잡혀 P3→P1 이
#     사무실로 돌아갔다. 그래서 폭이 아니라 '실제로 못 지나갔다'로 판단한다: 제어기 주행이 같은 자리에서 3번 실패하면
#     목표 브리지(nav2_goal_bridge.py)가 먼저 물러나 자세를 다시 잡고(10), 다시 와서 같은 자리에서 또 막히면 그 자리를
#     전역 비용 지도에 가상 장애물로 찍어 다른 길로 다시 계획하게 한다. ('경로 위 로봇 앞자리'를 바로 막던 방식은
#     돌아가는 길 · 물러날 길을 막아 로봇을 가두는 일이 거듭돼 버렸다.)
#  8) 장애물의 몸통 채우기: 라이다는 새 장애물의 앞면만 선으로 본다. 보인 면에서 면에 수직으로 뒤쪽 0.3m 를(폭은 보인 면 그대로) 가상 장애물로
#     찍어(목표 브리지), 계획이 선 바로 뒤를 빈 곳으로 믿지 않게 한다. 옆의 틈은 막지 않는다.
#     7 · 8 의 가상 장애물은 전역 비용 지도의 별도 층(virtual_layer)이다. 장애물 층의 관측으로 넣었을 때는 치운 뒤에도
#     표시가 남아(장애물 층은 라이다가 다시 볼 때까지 지우지 않는다) 멀쩡한 문을 막고 P3→P1 이 사무실로 돌아갔다.
#     (빔 방향으로 벽까지 모두 막아 보았으나 버렸다: 비스듬히 볼 때 틈 너머까지 막혀 지날 수 있는 0.6m 틈을 두고 돌아갔고,
#      목표가 장애물 뒤에 있으면 목표 자리가 막힌 것으로 찍혀 계획이 거부됐다.)
#     깊이 0.9m 로 두었을 때는 두께 0.2m 블록의 뒤 0.7m 까지 막아 그 뒤의 문을 닫았고, 가까운 돌아가는 길(랙 위) 대신
#     사무실을 거치는 먼 길이 나왔다. 두께는 알 수 없으므로 흔한 상자 두께만큼만 채운다.
#  9) 제어기용(지역) 비용 지도의 칸 0.05 → 0.025m. 폭 0.6m 틈에서 로봇 중심이 지날 띠는 0.16m(세 칸)뿐인데, 경계가
#     한 칸씩 어긋나면 한 칸까지 줄어 MPPI 후보 궤적이 전부 충돌로 판정됐다(틈 앞에서 15~31초 멈칫하거나 실패).
#     칸을 반으로 줄이자 같은 틈을 멈춤 없이 지났다(P1→P3 25초·92%, 막지 않았을 때와 같다). 지도가 로봇 주변 3m × 3m 라
#     칸이 3,600 → 14,400 개로 늘어도 제어 주기를 놓치지 않았다. 계획용(전역)은 0.05 그대로다.
# 10) 물러나 자세 잡기(목표 브리지): 로봇 중심이 장애물의 충돌 구역 안에 들어가 멈추면 Nav2 는 그 자리에서 계획 → 실패만
#     되풀이했다. 제어기 후보가 전부 충돌이고, 복구 동작(BackUp · Spin)도 'Collision Ahead' 로 시작하지 못했다(0.6m 틈을
#     지나 곧장 문으로 꺾는 자리에서 제어기 실패 13회 끝에 목표 실패). 같은 자리에서 3번 실패하거나 목표가 실패했는데
#     장애물이 0.4m 안에 있으면, 브리지가 라이다로 본 가까운 장애물에서 멀어지는 쪽으로(전진 · 후진 중 덜 도는 쪽)
#     최대 0.45m 움직인 뒤 다시 계획하게 한다. 실패한 목표는 3번까지 다시 보낸다. (지나온 길을 되짚는 후진은 뒤가
#     막혀 있으면 움직이지 못해 버렸다.)
#  (slam_toolbox 는 기본값을 쓴다. 0.2m·0.2rad 마다 반영하도록 바꿔 보았으나 에뮬레이션 환경에서 계산이 밀려
#   위치 추정이 틀어지고 지도가 번져 로봇이 장애물에 끼었다. 기본값(0.5m·0.5rad)으로 깨끗한 지도를 얻었다.)
# use_sim_time 과 지도 파일 경로는 실행할 때(sim.launch.py) 바꿔 넣는다. 실제 로봇은 이 파일을 그대로 쓰고 use_sim_time 만 False.
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # 처음 한 번 계획한 경로를 끝까지 쓴다. 다시 계획하는 때는 목표가 바뀌었거나 경로가 막혔을 때뿐이다(기본 트리는 1초마다 다시 계획해 경로가 흔들렸다).
    default_nav_to_pose_bt_xml: "/sim/config/navigate_fixed_plan.xml"
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15

    # MPPI: 매 주기 후보 궤적 batch_size 개를 time_steps × model_dt 초 앞까지 굴려 보고, 아래 평가 항목(critics)의
    # 점수로 가중 평균한 속도를 낸다. A* 경로를 따르되(PathAlign·PathFollow·PathAngle) 지역 비용 지도에 새로 찍힌
    # 장애물은 다시 계획되기를 기다리지 않고 옆으로 비켜 간다(ObstaclesCritic).
    # - model_dt 는 제어 주기(1 / controller_frequency)와 같아야 한다.
    # - 예측 거리 = vx_max × time_steps × model_dt = 0.22 × 3.0 = 0.66m. 거리 기준값(threshold_to_consider,
    #   prune_distance, offset_from_furthest)은 기본값(0.5m/s·1.4m 기준)을 이 거리에 맞춰 줄였다.
    # - vx_min 0: 후진하지 않는다(카메라가 앞을 본다). 방향이 크게 어긋나면 제자리에서 돈다(PathAngleCritic).
    # - ObstaclesCritic 의 inflation_radius · cost_scaling_factor 는 지역 비용 지도의 팽창 값과 같게 둔다.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 30
      model_dt: 0.1
      batch_size: 1000
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.5
      vx_max: 0.22
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.2
      iteration_count: 1
      prune_distance: 1.2
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic",
                "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 0.5
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.05
        near_goal_distance: 0.4
        inflation_radius: 0.6
        cost_scaling_factor: 3.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.7
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.15   # 도착 위치 허용 오차(0.12) 근처에 온 뒤에 방향을 맞춘다. 0.4 면 옆으로 0.2m 남기고 돌아서 버려 도착하지 못했다
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.4
        offset_from_furthest: 10
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        offset_from_furthest: 5
        threshold_to_consider: 0.7
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.4
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.4

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.025    # 전역(0.05)보다 촘촘하게: 좁은 틈에서 칸 어긋남으로 잃는 폭을 줄인다(머리 목록 9)
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 3.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "virtual_layer", "inflation_layer"]
      use_maximum: True      # 층을 덮어쓰지 않고 큰 값으로 합친다(virtual_layer 의 빈 칸이 벽 · 라이다 표시를 지우지 않게)
      # 가상 장애물(머리 목록 7 · 8): 목표 브리지가 지도와 같은 크기의 격자로 보낸다. 보낼 때마다 층 전체가 바뀌어 표시가 남지 않는다.
      # 계획에만 쓰고 제어기(지역 비용 지도)에는 넣지 않는다.
      virtual_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /inspection/virtual_map
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45   # 계획용: 벽에서 0.45m 까지만 비용을 둔다(그 밖은 0 → 열린 곳은 직선). 지역 비용 지도는 0.6 그대로
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    # Theta*(any-angle A*): 격자 칸을 따라가지 않고 서로 보이는 점끼리 직선으로 잇는다 → 곧은 구간은 직선, 모퉁이에서만 꺾이는
    # 최단에 가까운 경로. (Smac 2D A* + smoother 는 벽 비용을 따라 통로 가운데로 휘어 열린 곳에서도 S 자로 출렁였다)
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 2.0            # 벽 비용 띠(전역 팽창 0.45m)를 피하는 정도. 0.2 로 낮추면 모퉁이를 0.22m 로 스쳐 로봇이 충돌 구역에 든다
      w_heuristic_cost: 1.0
      allow_unknown: true
      use_final_approach_orientation: false

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 200
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
