# Nav2 설정 — TurtleBot3 Waffle Pi 기본값(turtlebot3_navigation2/param/humble/waffle_pi.yaml)에서 바꾼 점:
#  1) 전역·지역 비용 지도에서 voxel_layer 를 뺐다. 2D 라이다만 쓰는데 voxel 층이 지워지지 않는 표시를 남겨
#     저장 지도 운영(AMCL) 중 실제로 없는 벽(유령 장애물)이 좁은 복도·문을 막는 문제가 있었다.
#  2) 팽창 반경 1.0/0.55 → 0.6, 비용 기울기 3: 벽에서 0.6m 까지 비용이 서서히 줄어 경로가 통로 가운데로 난다.
#     (0.35·4 로 좁혔을 때는 경로가 벽을 끼고 났다. 통행 가능 여부는 로봇 반경 0.22 로만 정해지므로 1.0m 문도 지난다)
#  3) 도착 허용 오차 0.25 → 위치 0.12m·방향 0.15rad: 촬영 위치·방향을 맞추기 위해.
#  4) AMCL(위치 추정): 긴 복도(C1)에서 복도 방향으로 추정이 미끄러져(0.8m) 라이다가 엉뚱한 곳에 벽을 찍고 문을 막는 문제가 있었다.
#     빔 수 60→180, 갱신 간격 0.25m/0.2rad→0.1m/0.1rad, 라이다 최대 거리 8m(실물 라이다), z_hit 0.5→0.9·z_rand 0.5→0.1,
#     odom 오차 계수 alpha1~4 0.2→0.05 (시뮬레이션 odom 이 정확하기 때문. 실제 로봇은 바퀴 미끄러짐을 보고 0.1~0.2 로 다시 맞춘다).
#  5) 주행 제어기 DWB → Regulated Pure Pursuit: 굽은 곳에서는 제자리에서 경로 방향으로 먼저 돌고, 좁은 곳에서는 스스로 느려진다.
#  6) 진행 감시 0.5m/10s → 0.25m/15s: 좁은 틈을 느리게 지나거나 제자리 회전할 때 '진행 없음'으로 끊지 않도록.
#  7) 경로 계획 NavFn → Smac 2D(A*) + 경로 다듬기: 직선 구간의 계단 모양을 없앴다.
#  8) 라이다 측정 거리 3.5m → 8m(실물과 같게, sim.launch.py 가 Gazebo 모델을 바꿔 띄운다):
#     AMCL laser_max_range 8.0, 비용 지도 장애물 표시 7.5m·지우기 8m.
#  (slam_toolbox 는 기본값을 쓴다. 0.2m·0.2rad 마다 반영하도록 바꿔 보았으나 에뮬레이션 환경에서 계산이 밀려
#   위치 추정이 틀어지고 지도가 번져 로봇이 장애물에 끼었다. 기본값(0.5m·0.5rad)으로 깨끗한 지도를 얻었다.)
# use_sim_time 과 지도 파일 경로는 실행할 때(sim.launch.py) 바꿔 넣는다. 실제 로봇은 이 파일을 그대로 쓰고 use_sim_time 만 False.
amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 8.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: True
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15

    # Regulated Pure Pursuit: 경로 위 앞쪽 한 점(lookahead)을 곡선으로 따라가 매끄럽게 달린다.
    # (DWB 는 굽은 곳에서 앞으로 가며 돌다가 이미 벽을 바라본 채 멈추곤 했다 — 회전 후보가 벽 비용에 막혔다)
    # - 경로 방향과 0.45rad(약 26°) 넘게 어긋나면 먼저 제자리에서 돌아 경로를 바라본 뒤 출발한다.
    # - 바라보는 점을 0.2~0.5m 로 짧게 해서 굽은 곳의 안쪽 모서리를 깎아 지나가지 않는다.
    # - 좁은 곳(벽 비용)·급한 굽이에서는 스스로 0.08m/s 까지 줄인다.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22
      lookahead_dist: 0.3
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.5
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.08
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.4
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      use_fixed_curvature_lookahead: false
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.45
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 3.0
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: False
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: False
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    # A*(Smac 2D) + 경로 다듬기: 격자 A* 경로의 계단(울퉁불퉁)을 smoother 가 펴서 곧은 곳은 곧게, 굽은 곳은 둥글게 낸다.
    # (NavFn 은 격자 칸을 따라가는 경로를 그대로 내보내 직선 구간도 지그재그였다)
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0      # 벽 비용이 큰 칸을 피하는 정도(통로 가운데로)
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    wait:
      plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 200
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
