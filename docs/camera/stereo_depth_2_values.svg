<text x="660.0" y="706.0" font-size="13.5" font-weight="700" fill="#248a3d" text-anchor="start" font-family="Menlo, Consolas, monospace">10.0 m</text>
<text x="750.0" y="706.0" font-size="13.5" font-weight="700" fill="#e5352b" text-anchor="start" font-family="Menlo, Consolas, monospace">3.2 px</text>
<text x="890.0" y="706.0" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">약 3.09 m</text>
<text x="660.0" y="748.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">오차 ≈ Z² / (f′ · B)  — 거리가 2 배면 오차는 4 배</text>
<text x="660.0" y="772.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">멀수록 d 가 작아져 1 px 의 무게가 커진다</text>
<text x="36.0" y="812.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">곡선 위 빨간 점 = 오른쪽 표의 0.6 · 1 · 2 · 4 m (10 m 는 그래프 밖).  ① 그림의 예는 d = 53.9 px, Z = 0.6 m 인 점.</text>
<rect x="20.0" y="842.0" width="1080.0" height="200.0" rx="12" fill="#fff" stroke="#d1d1d6" stroke-width="1.0"/>
<text x="36.0" y="868.0" font-size="14.5" font-weight="700" fill="#1c1c1e" text-anchor="start">(다) Z 는 '광축 방향 깊이'다. 점까지의 직선거리는 X · Y 를 함께 구해서 계산한다</text>
<text x="52.0" y="904.0" font-size="14" font-weight="700" fill="#0a7c8c" text-anchor="start" font-family="Menlo, Consolas, monospace">X = (xL − cx′) · Z / f′</text>
<text x="380.0" y="904.0" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">= (360.9 − 325.0) × 0.6 / 538.5 = 0.040 m</text>
<text x="900.0" y="904.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">가로 (오른쪽 +)</text>
<text x="52.0" y="938.0" font-size="14" font-weight="700" fill="#0a7c8c" text-anchor="start" font-family="Menlo, Consolas, monospace">Y = (v − cy′) · Z / f′</text>
<text x="380.0" y="938.0" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">= (224.9 − 180.0) × 0.6 / 538.5 = 0.050 m</text>
<text x="900.0" y="938.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">세로 (아래 +)</text>
<text x="52.0" y="972.0" font-size="14" font-weight="700" fill="#248a3d" text-anchor="start" font-family="Menlo, Consolas, monospace">직선거리 = √(X² + Y² + Z²)</text>
<text x="380.0" y="972.0" font-size="13.5" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">= √(0.04² + 0.05² + 0.6²) = 0.603 m</text>
<text x="900.0" y="972.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">왼쪽 카메라에서 점까지</text>
<text x="52.0" y="1022.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">v 는 점이 찍힌 행, cy′ 는 광축이 닿는 행 — 둘 다 ① 그림 (다) 와 위 P 행렬에 있다.</text>
</svg>