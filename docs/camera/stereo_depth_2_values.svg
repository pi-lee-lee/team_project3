<text x="52.0" y="452.0" font-size="12.5" font-weight="400" fill="#1c1c1e" text-anchor="start">평행화는 영상을 회전하고, 빈 가장자리가 없도록 확대한다(alpha=0). 좌우 위치차 d 는 평행화된 영상에서 재므로 거리 식에는 f′ 를 쓴다.</text>
