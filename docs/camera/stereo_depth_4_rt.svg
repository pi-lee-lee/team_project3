<rect x="0.0" y="0.0" width="1120.0" height="860.0" rx="0" fill="#f2f2f7" stroke="none" stroke-width="0"/>
<text x="30.0" y="38.0" font-size="19" font-weight="700" fill="#1c1c1e" text-anchor="start">④ R · T: 두 카메라 사이의 회전과 이동 — 같은 순간에 같은 보드를 찍은 쌍으로 구한다</text>
<text x="30.0" y="62.0" font-size="13.5" font-weight="400" fill="#636366" text-anchor="start">cv2.stereoCalibrate(..., flags=CALIB_FIX_INTRINSIC): K1 · D1 · K2 · D2 는 고정, R · T 만 푼다</text>
