<rect x="358.0" y="714.0" width="12.0" height="12.0" rx="0" fill="#1c1c1e" stroke="none" stroke-width="0"/>
<rect x="370.0" y="702.0" width="12.0" height="12.0" rx="0" fill="#1c1c1e" stroke="none" stroke-width="0"/>
<rect x="382.0" y="690.0" width="12.0" height="12.0" rx="0" fill="#1c1c1e" stroke="none" stroke-width="0"/>
<rect x="382.0" y="714.0" width="12.0" height="12.0" rx="0" fill="#1c1c1e" stroke="none" stroke-width="0"/>
<rect x="334.0" y="690.0" width="60.0" height="36.0" rx="0" fill="none" stroke="#1c1c1e" stroke-width="1.0"/>
<text x="560.0" y="680.0" font-size="12.5" font-weight="700" fill="#1c1c1e" text-anchor="start">이 그림에 쓴 값 (가정 — 보정 뒤 교체):</text>
<text x="560.0" y="708.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">R (회전 벡터, 도) = (-1.00, 0.80, 0.20)</text>
<text x="560.0" y="732.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">T [m] = (-0.0600, -0.0002, 0.0008)</text>
<text x="560.0" y="756.0" font-size="13" font-weight="700" fill="#248a3d" text-anchor="start" font-family="Menlo, Consolas, monospace">|T| = 60.0 mm  → ② 그림의 B</text>
<text x="560.0" y="780.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">보정 뒤 stereo RMS 0.5 px 이하면 좋다</text>
<text x="560.0" y="812.0" font-size="11.5" font-weight="400" fill="#636366" text-anchor="start">T 의 x 가 음수: X_R = R·X_L + T 에서 오른쪽 카메라 좌표로 옮기면</text>
<text x="560.0" y="830.0" font-size="11.5" font-weight="400" fill="#636366" text-anchor="start">점이 왼쪽으로(−x) 옮겨지기 때문이다.</text>
</svg>