<text x="202.0" y="176.0" font-size="12.5" font-weight="700" fill="#e5352b" text-anchor="end">보드 원점 (코너 0번)</text>
<text x="426.0" y="140.0" font-size="12.5" font-weight="700" fill="#1c1c1e" text-anchor="start">체커보드</text>
<line x1="210.0" y1="190.0" x2="262.0" y2="180.0" stroke="#e5352b" stroke-width="1.4" marker-end="url(#ae5352b)"/>
<text x="250.0" y="208.0" font-size="11" font-weight="400" fill="#e5352b" text-anchor="start">보드 x</text>
<rect x="144.0" y="476.0" width="52.0" height="30.0" rx="4" fill="#fff" stroke="#007aff" stroke-width="1.6"/>
<polygon points="158.0,476.0 182.0,476.0 177.0,470.0 163.0,470.0" fill="#fff" stroke="#007aff" stroke-width="1.6"/>
<circle cx="170.0" cy="470.0" r="4" fill="#007aff" stroke="none" stroke-width="1.0"/>
<text x="136.0" y="498.0" font-size="13.5" font-weight="700" fill="#007aff" text-anchor="end">왼쪽 카메라</text>
<rect x="384.0" y="476.0" width="52.0" height="30.0" rx="4" fill="#fff" stroke="#b25000" stroke-width="1.6"/>
<polygon points="398.0,476.0 422.0,476.0 417.0,470.0 403.0,470.0" fill="#fff" stroke="#b25000" stroke-width="1.6"/>
<circle cx="410.0" cy="470.0" r="4" fill="#b25000" stroke="none" stroke-width="1.0"/>
<text x="444.0" y="498.0" font-size="13.5" font-weight="700" fill="#b25000" text-anchor="start">오른쪽 카메라</text>
<line x1="170.0" y1="470.0" x2="207.0" y2="196.0" stroke="#007aff" stroke-width="2.0" marker-end="url(#a007aff)"/>
<text x="150.0" y="320.0" font-size="14" font-weight="700" fill="#007aff" text-anchor="end" font-family="Menlo, Consolas, monospace">R_L, t_L</text>
<text x="150.0" y="340.0" font-size="11.5" font-weight="400" fill="#007aff" text-anchor="end">왼쪽에서 본 보드 자세</text>
<line x1="410.0" y1="470.0" x2="215.0" y2="196.0" stroke="#b25000" stroke-width="2.0" marker-end="url(#ab25000)"/>
<text x="330.0" y="330.0" font-size="14" font-weight="700" fill="#b25000" text-anchor="start" font-family="Menlo, Consolas, monospace">R_R, t_R</text>
<text x="330.0" y="350.0" font-size="11.5" font-weight="400" fill="#b25000" text-anchor="start">오른쪽에서 본 보드 자세</text>
<line x1="178.0" y1="532.0" x2="402.0" y2="532.0" stroke="#248a3d" stroke-width="2.2" marker-end="url(#a248a3d)"/>
<text x="290.0" y="524.0" font-size="14" font-weight="700" fill="#248a3d" text-anchor="middle" font-family="Menlo, Consolas, monospace">R, T  (왼쪽 → 오른쪽)</text>
<text x="290.0" y="554.0" font-size="13" font-weight="700" fill="#248a3d" text-anchor="middle">|T| = B = 60.0 mm</text>
<text x="36.0" y="588.0" font-size="11.5" font-weight="400" fill="#636366" text-anchor="start">보드를 움직이면 R_L · t_L · R_R · t_R 는 쌍마다 바뀌지만, R · T 는 바에 고정돼 바뀌지 않는다.</text>
<rect x="596.0" y="80.0" width="504.0" height="520.0" rx="12" fill="#fff" stroke="#d1d1d6" stroke-width="1.0"/>
<text x="612.0" y="106.0" font-size="14.5" font-weight="700" fill="#1c1c1e" text-anchor="start">(나) 식</text>
<text x="612.0" y="138.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">보드 위 코너 하나의 보드 좌표 (s = --square, m):</text>
<text x="628.0" y="162.0" font-size="14" font-weight="700" fill="#e5352b" text-anchor="start" font-family="Menlo, Consolas, monospace">X_board = (i · s, j · s, 0)</text>
<text x="612.0" y="196.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">그 코너를 왼쪽 · 오른쪽 카메라 좌표로 쓰면:</text>
<text x="628.0" y="220.0" font-size="14" font-weight="700" fill="#007aff" text-anchor="start" font-family="Menlo, Consolas, monospace">X_L = R_L · X_board + t_L</text>
<text x="628.0" y="246.0" font-size="14" font-weight="700" fill="#b25000" text-anchor="start" font-family="Menlo, Consolas, monospace">X_R = R_R · X_board + t_R</text>
<text x="612.0" y="280.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">두 카메라 좌표 사이의 관계가 R · T:</text>
<text x="628.0" y="304.0" font-size="14" font-weight="700" fill="#248a3d" text-anchor="start" font-family="Menlo, Consolas, monospace">X_R = R · X_L + T</text>
<text x="612.0" y="338.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">위 세 식에서 X_board 를 지우면:</text>
<rect x="612.0" y="350.0" width="472.0" height="64.0" rx="8" fill="#eaf6ec" stroke="#248a3d" stroke-width="1.4"/>
<text x="628.0" y="376.0" font-size="15" font-weight="700" fill="#248a3d" text-anchor="start" font-family="Menlo, Consolas, monospace">R = R_R · R_Lᵀ</text>
<text x="628.0" y="402.0" font-size="15" font-weight="700" fill="#248a3d" text-anchor="start" font-family="Menlo, Consolas, monospace">T = t_R − R · t_L</text>
<text x="612.0" y="440.0" font-size="12.5" font-weight="400" fill="#1c1c1e" text-anchor="start">쌍 하나로도 식은 풀리지만 검출 오차가 섞인다.</text>
<text x="612.0" y="462.0" font-size="12.5" font-weight="400" fill="#1c1c1e" text-anchor="start">그래서 쌍 수십 개를 모아, 두 영상의 재투영 오차가</text>
<text x="612.0" y="484.0" font-size="12.5" font-weight="400" fill="#1c1c1e" text-anchor="start">가장 작아지는 R · T 하나를 찾는다 (stereoCalibrate).</text>
<text x="612.0" y="506.0" font-size="12.5" font-weight="400" fill="#1c1c1e" text-anchor="start">X_board 가 m 단위라 t 와 T 도 m 단위가 된다.</text>
<text x="612.0" y="528.0" font-size="12.5" font-weight="400" fill="#1c1c1e" text-anchor="start">s 를 10 % 크게 넣으면 B 도, 모든 거리도 10 % 커진다.</text>
<rect x="20.0" y="616.0" width="1080.0" height="228.0" rx="12" fill="#fff" stroke="#d1d1d6" stroke-width="1.0"/>
<text x="36.0" y="642.0" font-size="14.5" font-weight="700" fill="#1c1c1e" text-anchor="start">(다) 같은 순간 찍은 한 쌍 — 보드가 두 영상에 통째로 들어와야 한다</text>
