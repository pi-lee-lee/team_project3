<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="900" viewBox="0 0 1120 900" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif" xml:space="preserve">
<defs>
<marker id="a1c1c1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c1c1e"/></marker>
<marker id="a007aff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007aff"/></marker>
<marker id="ab25000" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b25000"/></marker>
<marker id="a248a3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#248a3d"/></marker>
<marker id="ae5352b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e5352b"/></marker>
<marker id="a8e8e93" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e8e93"/></marker>
<marker id="a8944ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8944ab"/></marker>
<marker id="a0a7c8c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a7c8c"/></marker>
</defs>
<rect x="0.0" y="0.0" width="1120.0" height="900.0" rx="0" fill="#f2f2f7" stroke="none" stroke-width="0"/>
<text x="30.0" y="38.0" font-size="19" font-weight="700" fill="#1c1c1e" text-anchor="start">⑥ 정리: 거꾸로 따라간 사슬과 실제로 하는 순서</text>
<text x="30.0" y="62.0" font-size="13.5" font-weight="400" fill="#636366" text-anchor="start">왼쪽은 아래에서 위로 읽는다(필요한 값 → 그 값을 만드는 것). 오른쪽은 위에서 아래로 실제로 하는 일</text>
<rect x="20.0" y="80.0" width="500.0" height="800.0" rx="12" fill="#fff" stroke="#d1d1d6" stroke-width="1.0"/>
<text x="36.0" y="106.0" font-size="14.5" font-weight="700" fill="#1c1c1e" text-anchor="start">거꾸로: 무엇이 무엇을 필요로 하나</text>
<rect x="40.0" y="130.0" width="460.0" height="76.0" rx="10" fill="#fff" stroke="#248a3d" stroke-width="1.8"/>
<text x="56.0" y="162.0" font-size="14" font-weight="700" fill="#248a3d" text-anchor="start" font-family="Menlo, Consolas, monospace">① Z = f′ · B / d</text>
<text x="56.0" y="188.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">거리</text>
<line x1="270.0" y1="248.0" x2="270.0" y2="210.0" stroke="#1c1c1e" stroke-width="1.6" marker-end="url(#a1c1c1e)"/>
<text x="282.0" y="234.0" font-size="11" font-weight="400" fill="#636366" text-anchor="start">아래 상자의 결과가 위 상자의 입력</text>
<rect x="40.0" y="252.0" width="460.0" height="76.0" rx="10" fill="#fff" stroke="#e5352b" stroke-width="1.8"/>
<text x="56.0" y="284.0" font-size="14" font-weight="700" fill="#e5352b" text-anchor="start" font-family="Menlo, Consolas, monospace">② f′·B = −P_right[0,3]  ·  d = SGBM</text>
<text x="56.0" y="310.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">P 행렬 · 평행화된 영상의 같은 행 검색</text>
<line x1="270.0" y1="370.0" x2="270.0" y2="332.0" stroke="#1c1c1e" stroke-width="1.6" marker-end="url(#a1c1c1e)"/>
<text x="282.0" y="356.0" font-size="11" font-weight="400" fill="#636366" text-anchor="start">아래 상자의 결과가 위 상자의 입력</text>
<rect x="40.0" y="374.0" width="460.0" height="76.0" rx="10" fill="#fff" stroke="#007aff" stroke-width="1.8"/>
<text x="56.0" y="406.0" font-size="14" font-weight="700" fill="#007aff" text-anchor="start" font-family="Menlo, Consolas, monospace">③ R1 · R2 · P1 · P2</text>
<text x="56.0" y="432.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">cv2.stereoRectify</text>
<line x1="270.0" y1="492.0" x2="270.0" y2="454.0" stroke="#1c1c1e" stroke-width="1.6" marker-end="url(#a1c1c1e)"/>
<text x="282.0" y="478.0" font-size="11" font-weight="400" fill="#636366" text-anchor="start">아래 상자의 결과가 위 상자의 입력</text>
<rect x="40.0" y="496.0" width="460.0" height="76.0" rx="10" fill="#fff" stroke="#b25000" stroke-width="1.8"/>
<text x="56.0" y="528.0" font-size="14" font-weight="700" fill="#b25000" text-anchor="start" font-family="Menlo, Consolas, monospace">④ R · T  (|T| = B)</text>
<text x="56.0" y="554.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">cv2.stereoCalibrate · 동시 쌍</text>
<line x1="270.0" y1="614.0" x2="270.0" y2="576.0" stroke="#1c1c1e" stroke-width="1.6" marker-end="url(#a1c1c1e)"/>
<text x="282.0" y="600.0" font-size="11" font-weight="400" fill="#636366" text-anchor="start">아래 상자의 결과가 위 상자의 입력</text>
<rect x="40.0" y="618.0" width="460.0" height="76.0" rx="10" fill="#fff" stroke="#8944ab" stroke-width="1.8"/>
<text x="56.0" y="650.0" font-size="14" font-weight="700" fill="#8944ab" text-anchor="start" font-family="Menlo, Consolas, monospace">⑤ K1 · D1 · K2 · D2</text>
<text x="56.0" y="676.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">cv2.calibrateCamera · 카메라마다</text>
<line x1="270.0" y1="736.0" x2="270.0" y2="698.0" stroke="#1c1c1e" stroke-width="1.6" marker-end="url(#a1c1c1e)"/>
<text x="282.0" y="722.0" font-size="11" font-weight="400" fill="#636366" text-anchor="start">아래 상자의 결과가 위 상자의 입력</text>
<rect x="40.0" y="740.0" width="460.0" height="76.0" rx="10" fill="#fff" stroke="#1c1c1e" stroke-width="1.8"/>
<text x="56.0" y="772.0" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">체커보드 사진 (코너 3D ↔ 픽셀)</text>
<text x="56.0" y="798.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">s = 한 칸 길이 [m]</text>
<rect x="536.0" y="80.0" width="564.0" height="800.0" rx="12" fill="#fff" stroke="#d1d1d6" stroke-width="1.0"/>
<text x="552.0" y="106.0" font-size="14.5" font-weight="700" fill="#1c1c1e" text-anchor="start">실제 순서 (함수는 OpenCV)</text>
<rect x="552.0" y="128.0" width="532.0" height="88.0" rx="10" fill="#fff" stroke="#1c1c1e" stroke-width="1.6"/>
<circle cx="578.0" cy="154.0" r="14" fill="#1c1c1e" stroke="none" stroke-width="1.0"/>
<text x="578.0" y="159.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="602.0" y="159.0" font-size="13" font-weight="700" fill="#1c1c1e" text-anchor="start">체커보드를 준비하고 한 칸 길이 s 를 자로 잰다</text>
<text x="602.0" y="184.0" font-size="12" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">내부 코너 수 (cols · rows)</text>
<text x="602.0" y="204.0" font-size="12" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">s [m] — 틀리면 모든 거리가 같은 비율로 틀린다</text>
<rect x="552.0" y="230.0" width="532.0" height="88.0" rx="10" fill="#fff" stroke="#1c1c1e" stroke-width="1.6"/>
<circle cx="578.0" cy="256.0" r="14" fill="#1c1c1e" stroke="none" stroke-width="1.0"/>
<text x="578.0" y="261.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="602.0" y="261.0" font-size="13" font-weight="700" fill="#1c1c1e" text-anchor="start">두 카메라를 동시에 녹화한다 (보드를 여러 자세로)</text>
<text x="602.0" y="286.0" font-size="12" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">좌 · 우 촬영 시각이 맞는 쌍만 쓴다</text>
<text x="602.0" y="306.0" font-size="12" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">녹화 중 카메라 고정대를 건드리지 않는다</text>
<rect x="552.0" y="332.0" width="532.0" height="88.0" rx="10" fill="#fff" stroke="#8944ab" stroke-width="1.6"/>
<circle cx="578.0" cy="358.0" r="14" fill="#8944ab" stroke="none" stroke-width="1.0"/>
<text x="578.0" y="363.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="602.0" y="363.0" font-size="13" font-weight="700" fill="#8944ab" text-anchor="start">카메라마다 K · D 를 구한다  → ⑤</text>
<text x="602.0" y="388.0" font-size="12" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">cv2.findChessboardCorners · cornerSubPix</text>
<text x="602.0" y="408.0" font-size="12" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">cv2.calibrateCamera</text>
<rect x="552.0" y="434.0" width="532.0" height="88.0" rx="10" fill="#fff" stroke="#b25000" stroke-width="1.6"/>
<circle cx="578.0" cy="460.0" r="14" fill="#b25000" stroke="none" stroke-width="1.0"/>
<text x="578.0" y="465.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="602.0" y="465.0" font-size="13" font-weight="700" fill="#b25000" text-anchor="start">동시 쌍으로 R · T, 이어서 R1 R2 P1 P2  → ④ ③ ②</text>
<text x="602.0" y="490.0" font-size="12" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">cv2.stereoCalibrate (CALIB_FIX_INTRINSIC)</text>
<text x="602.0" y="510.0" font-size="12" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">cv2.stereoRectify → camera_info 두 개에 기록</text>
<rect x="552.0" y="536.0" width="532.0" height="88.0" rx="10" fill="#fff" stroke="#007aff" stroke-width="1.6"/>
<circle cx="578.0" cy="562.0" r="14" fill="#007aff" stroke="none" stroke-width="1.0"/>
<text x="578.0" y="567.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
<text x="602.0" y="567.0" font-size="13" font-weight="700" fill="#007aff" text-anchor="start">검사: 같은 행에 오는가, |T| 가 자와 맞는가</text>
<text x="602.0" y="592.0" font-size="12" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">평행화 뒤 같은 코너의 행 차이 &lt; 0.5 px</text>
<text x="602.0" y="612.0" font-size="12" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">|T| 와 자로 잰 렌즈 간격 2 % 안</text>
<rect x="552.0" y="638.0" width="532.0" height="88.0" rx="10" fill="#fff" stroke="#248a3d" stroke-width="1.6"/>
<circle cx="578.0" cy="664.0" r="14" fill="#248a3d" stroke="none" stroke-width="1.0"/>
<text x="578.0" y="669.0" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="602.0" y="669.0" font-size="13" font-weight="700" fill="#248a3d" text-anchor="start">운용: 매 프레임 평행화 → SGBM 으로 d → Z  → ①</text>
<text x="602.0" y="694.0" font-size="12" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">cv2.initUndistortRectifyMap (한 번) · cv2.remap</text>
<text x="602.0" y="714.0" font-size="12" font-weight="400" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">cv2.StereoSGBM → d → Z = f′·B/d</text>
<text x="552.0" y="860.0" font-size="11.5" font-weight="400" fill="#636366" text-anchor="start">1 ~ 5 는 camera_info 두 개를 채우는 일 — 카메라를 다시 달거나 고정대가 휘지 않으면 한 번이면 된다.</text>
</svg>