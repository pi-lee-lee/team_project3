<text x="36.0" y="1092.0" font-size="12.5" font-weight="400" fill="#1c1c1e" text-anchor="start">SGBM: 왼쪽의 작은 블록을 오른쪽 같은 행에서 d = 0, 1, 2, … 만큼 왼쪽으로 옮겨 가며 비교하고, 가장 비슷한 d 를 고른다(초록 띠).</text>
<text x="36.0" y="1116.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">찾을 수 있는 가장 큰 d 가 가장 가까운 거리를 정한다:  Z 최소 = f′ · B / d 최대.  행이 맞지 않으면 짝을 잘못 찾는다.</text>
